name: GitHub metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Stats + top languages, including private and organization repositories
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: DT-GAMER
          template: classic
          base: header, activity, community, repositories
          repositories: 300
          repositories_affiliations: owner, collaborator, organization_member
          repositories_skipped: DT-GAMER/DT-GAMER
          commits_authoring: DT-GAMER, Abakpa Dominic, abakpad82@gmail.com, abakpad82@gmaail.com
          config_timezone: Africa/Lagos
          config_display: large
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, less, mdx, jupyter notebook, blade, ejs, handlebars, procfile, makefile, dockerfile
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          committer_message: "chore: update metrics [skip ci]"
